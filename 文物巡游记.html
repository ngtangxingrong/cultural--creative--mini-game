<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>穆王八骏 · 文物巡游记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;background:#1a0a0e;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none}
#app{width:100%;max-width:420px;margin:0 auto;height:100vh;overflow:hidden;position:relative;background:linear-gradient(180deg,#1a0a2e 0%,#2a1a0a 30%,#3a2a1a 60%,#5a3a1a 100%)}

/* ---- 顶部状态 ---- */
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#f0d5a0;font-size:13px}
.header .title{font-size:18px;font-weight:bold;letter-spacing:2px;color:#ffd700;text-shadow:0 0 10px #ff880040}
.header .progress{font-size:12px;color:#c0a070}
.header .progress span{color:#ffd700}

/* ---- 主场景：探索区 ---- */
.scene-area{position:relative;height:40vh;margin:0 12px;border-radius:16px;overflow:hidden;border:1px solid #c8a05040;background:linear-gradient(135deg,#2a1a0e,#4a2a1a)}
.scene-canvas{width:100%;height:100%;object-fit:cover}
.scene-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(0deg,rgba(10,0,0,0.8),transparent)}
.scene-name{font-size:20px;color:#ffd700;text-shadow:0 2px 8px rgba(0,0,0,0.8);margin-bottom:2px}
.scene-desc{font-size:12px;color:#d0b890;text-shadow:0 1px 4px rgba(0,0,0,0.6)}
.scene-hint{font-size:11px;color:#c0a070;margin-top:6px;opacity:0.8}

/* ---- 马匹选择 ---- */
.horse-select{position:relative;padding:8px 12px 4px}
.horse-grid{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.horse-grid::-webkit-scrollbar{display:none}
.horse-btn{flex:0 0 60px;height:68px;border-radius:10px;border:2px solid rgba(255,215,0,0.2);background:rgba(255,255,255,0.05);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;padding:4px}
.horse-btn:active{transform:scale(0.92)}
.horse-btn img{width:100%;height:46px;object-fit:contain;border-radius:6px;display:block}
.horse-btn .lbl{font-size:9px;color:#c0a070;text-align:center;margin-top:2px;white-space:nowrap}
.horse-btn.selected{border-color:#ffd700;background:rgba(255,215,0,0.15);box-shadow:0 0 12px #ffd70040}
.horse-btn.recommended{border-color:#ff8800;box-shadow:0 0 8px #ff880040}
.horse-btn.locked{opacity:0.3;pointer-events:none}
.selected-preview{text-align:center;margin:4px 0 2px;min-height:40px}
.selected-preview img{height:60px;border-radius:8px;border:2px solid rgba(255,215,0,0.3);display:inline-block}
.selected-preview .pname{font-size:12px;color:#ffd700;margin-left:6px;display:inline-block;vertical-align:middle}

/* ---- 卡牌展示 ---- */
.card-area{position:relative;height:30vh;display:flex;align-items:center;justify-content:center;margin:0 16px 8px}
.card{width:160px;height:220px;border-radius:14px;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:default}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.card-back{background:linear-gradient(135deg,#4a2a1a,#2a1a0e);border:2px solid #c8a050;transform:rotateY(180deg)}
.card-front{background:linear-gradient(135deg,#f5f0e8,#e8ddd0);border:2px solid #c8a050;overflow:hidden}
.card-front .icon{font-size:48px;margin-bottom:8px}
.card-front .name{font-size:14px;color:#3a2a1a;font-weight:bold;text-align:center}
.card-front .detail{font-size:10px;color:#6a5a4a;text-align:center;margin-top:4px;line-height:1.4}
.card-back-text{color:#c8a050;font-size:12px;text-align:center;letter-spacing:1px;line-height:1.6}
.card-back-text .big{font-size:24px;color:#ffd700;display:block;margin-bottom:6px;letter-spacing:4px}

/* ---- 行动按钮 ---- */
.action-bar{display:flex;gap:8px;padding:6px 16px 12px;justify-content:center}
.btn{flex:1;padding:10px;border-radius:22px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:2px}
.btn-primary{background:linear-gradient(135deg,#c8a050,#a07830);color:#fff;box-shadow:0 2px 12px #c8a05040}
.btn-primary:active{transform:scale(0.96)}
.btn-primary:disabled{opacity:0.4;pointer-events:none}
.btn-secondary{background:rgba(255,255,255,0.1);color:#c0a070;border:1px solid #c8a05040}
.btn-secondary:active{transform:scale(0.96)}

/* ---- 图鉴 ---- */
.collection-toggle{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(200,160,80,0.2);border:1px solid #c8a05040;color:#ffd700;font-size:16px;cursor:pointer;z-index:10;backdrop-filter:blur(4px)}

.collection-panel{position:fixed;top:0;left:0;right:0;height:100vh;max-width:420px;margin:0 auto;background:rgba(10,0,0,0.92);backdrop-filter:blur(8px);z-index:50;display:none;flex-direction:column;padding:20px 16px}
.collection-panel.open{display:flex}
.collection-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#f0d5a0}
.collection-header h3{font-size:18px;color:#ffd700;letter-spacing:3px}
.collection-close{width:32px;height:32px;border-radius:50%;border:1px solid #c8a05040;background:transparent;color:#c0a070;font-size:18px;cursor:pointer}
.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow-y:auto;flex:1;padding:4px}
.collection-item{aspect-ratio:3/4;border-radius:10px;border:1px solid #c8a05030;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#c0a070;background:rgba(255,255,255,0.03);position:relative;overflow:hidden}
.collection-item.found{background:linear-gradient(135deg,#3a2a1a,#2a1a0e);border-color:#c8a050}
.collection-item .icon{font-size:28px;margin-bottom:4px}
.collection-item .name{font-size:10px;color:#c0a070}
.collection-item .new-badge{position:absolute;top:2px;right:2px;background:#ffd700;color:#1a0a0e;font-size:8px;padding:1px 4px;border-radius:6px;font-weight:bold}
.collection-count{text-align:center;padding:8px;color:#c0a070;font-size:12px;border-top:1px solid #c8a05020;margin-top:4px}

/* ---- 动画 ---- */
@keyframes cardAppear{
  0%{transform:scale(0) rotateY(0deg);opacity:0}
  50%{transform:scale(1.1) rotateY(90deg);opacity:1}
  100%{transform:scale(1) rotateY(180deg)}
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@keyframes particle{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.floating{animation:float 2s ease-in-out infinite}
.particle-burst{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd700;pointer-events:none}
.discover-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#ffd700;text-shadow:0 0 20px #ff880080;letter-spacing:4px;z-index:30;pointer-events:none;animation:discoverAnim 1.2s ease-out forwards}
@keyframes discoverAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.8) translateY(-20px)}
}

/* ---- 文物获取成功提示 ---- */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#ffd700;padding:10px 24px;border-radius:20px;font-size:14px;z-index:40;backdrop-filter:blur(4px);border:1px solid #c8a05040;animation:toastIn .3s ease-out;white-space:nowrap}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(20px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* ---- 响应式 ---- */
@media(max-width:380px){
  .horse-btn{flex:0 0 48px;height:48px}
  .horse-btn .dot{width:24px;height:24px}
  .card{width:140px;height:192px}
}
</style>
</head>
<body>
<div id="app">

<!-- 顶部 -->
<div class="header">
  <div class="title">🏛 文物巡遊</div>
  <div class="progress">收集 <span id="collectCount">0</span>/12</div>
</div>

<!-- 探索场景 -->
<div class="scene-area" id="sceneArea">
  <canvas class="scene-canvas" id="sceneCanvas"></canvas>
  <div class="scene-overlay">
    <div class="scene-name" id="sceneName">莫高窟 · 第45窟</div>
    <div class="scene-desc" id="sceneDesc">彩塑與壁畫的絕響</div>
    <div class="scene-hint" id="sceneHint">💡 暗處有壁畫需要光照才能看清...</div>
  </div>
  <button class="collection-toggle" onclick="toggleCollection()">📖</button>
</div>

<!-- 马匹选择 -->
<div class="horse-select">
  <div class="horse-grid" id="horseGrid"></div>
  <div class="selected-preview" id="horsePreview"></div>
</div>

<!-- 卡牌区域 -->
<div class="card-area" id="cardArea">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-back-text">
        <span class="big">派出神駿</span>
        選擇具有合適能力的馬<br>
        去探索未知的文物
      </div>
    </div>
    <div class="card-face card-back">
      <div class="icon" id="cardIcon" style="font-size:48px;margin-bottom:8px">🏺</div>
      <div class="name" id="cardName" style="font-size:14px;color:#3a2a1a;font-weight:bold;text-align:center">文物名稱</div>
      <div class="detail" id="cardDetail" style="font-size:10px;color:#6a5a4a;text-align:center;margin-top:4px;line-height:1.4">發現於此處的珍貴文物</div>
    </div>
  </div>
</div>

<!-- 操作栏 -->
<div class="action-bar">
  <button class="btn btn-primary" id="btnExplore" onclick="beginExplore()">派出神駿</button>
  <button class="btn btn-secondary" onclick="showHint()">🏷 線索</button>
</div>

<!-- 图鉴 -->
<div class="collection-panel" id="collectionPanel">
  <div class="collection-header">
    <h3>📖 文物圖鑑</h3>
    <button class="collection-close" onclick="toggleCollection()">✕</button>
  </div>
  <div class="collection-grid" id="collectionGrid"></div>
  <div class="collection-count">已收集 <span id="collectedTotal">0</span> / 12 件</div>
</div>

</div>

// ---- 游戏状态 ----
let state = {
  currentScene: 0,
  currentRelic: 0,
  selectedHorse: null,
  collected: new Set(),
  discovered: new Set(),
  totalRelics: SCENES.reduce((s,c)=>s+c.relics.length,0)
};

// ---- 初始化 ----
let sceneCanvas, sceneCtx;

function init() {
  sceneCanvas = document.getElementById('sceneCanvas');
  sceneCtx = sceneCanvas.getContext('2d');
  resizeScene();
  window.addEventListener('resize', resizeScene);
  
  buildHorseGrid();
  buildCollectionGrid();
  loadScene(0);
  updateUI();
}

function resizeScene() {
  const area = document.getElementById('sceneArea');
  sceneCanvas.width = area.offsetWidth || 380;
  sceneCanvas.height = area.offsetHeight || 300;
}

// ---- 场景渲染 ----
function drawScene(idx) {
  const s = SCENES[idx];
  if(!s || !sceneCtx) return;
  const w = sceneCanvas.width, h = sceneCanvas.height;
  const bg = s.bg;
  
  // 天空渐变
  const grad = sceneCtx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,bg.top); grad.addColorStop(0.4,bg.mid); grad.addColorStop(1,bg.bot);
  sceneCtx.fillStyle = grad;
  sceneCtx.fillRect(0,0,w,h);
  
  // 远山
  sceneCtx.fillStyle = bg.mount;
  sceneCtx.globalAlpha = 0.3;
  for(let i=0; i<3; i++) {
    sceneCtx.beginPath();
    sceneCtx.moveTo(i*w*0.4-20, h*0.7);
    sceneCtx.quadraticCurveTo(i*w*0.4+40, h*0.5-Math.sin(i)*20, i*w*0.4+80, h*0.7);
    sceneCtx.lineTo(i*w*0.4+100, h);
    sceneCtx.lineTo(i*w*0.4-40, h);
    sceneCtx.fill();
  }
  sceneCtx.globalAlpha = 1;
  
  // 地面
  sceneCtx.fillStyle = bg.bot;
  sceneCtx.fillRect(0, h*0.75, w, h*0.25);
  
  // 建筑轮廓（洞窟/佛塔）
  sceneCtx.fillStyle = 'rgba(0,0,0,0.2)';
  for(let i=0; i<4; i++) {
    const bx = w*0.15 + i*w*0.22;
    const bw = 30+Math.sin(i)*10, bh = 40+Math.cos(i*2)*15;
    sceneCtx.beginPath();
    sceneCtx.arc(bx, h*0.75-bh, bw/2, Math.PI, 0);
    sceneCtx.lineTo(bx+bw/2, h*0.75);
    sceneCtx.lineTo(bx-bw/2, h*0.75);
    sceneCtx.fill();
  }
  
  // 星星
  sceneCtx.fillStyle = 'rgba(255,255,255,0.3)';
  for(let i=0; i<12; i++) {
    const sx = Math.sin(i*1.7)*w*0.45 + w*0.5;
    const sy = Math.cos(i*2.3)*h*0.3 + h*0.2;
    sceneCtx.beginPath();
    sceneCtx.arc(sx, sy, 1+Math.sin(Date.now()*0.001+i)*0.5, 0, Math.PI*2);
    sceneCtx.fill();
  }
}

function loadScene(idx) {
  const s = SCENES[idx];
  document.getElementById('sceneName').textContent = s.name;
  document.getElementById('sceneDesc').textContent = s.desc;
  document.getElementById('sceneHint').textContent = '💡 ' + s.hint;
  
  state.currentScene = idx;
  state.selectedHorse = null;
  
  // 找该场景未收集的文物
  const uncollected = s.relics.filter(r => !state.collected.has(r.id));
  if(uncollected.length > 0) {
    state.currentRelic = s.relics.indexOf(uncollected[0]);
  } else {
    state.currentRelic = -1; // 全部已收集
  }
  
  updateCard();
  updateUI();
  drawScene(idx);
  updateHorseSelection();
}

// ---- 马匹选择 ----
function buildHorseGrid() {
  const grid = document.getElementById('horseGrid');
  grid.innerHTML = '';
  HORSES.forEach(h => {
    const btn = document.createElement('div');
    btn.className = 'horse-btn';
    btn.dataset.id = h.id;
    btn.onclick = () => selectHorse(h.id);
    
    const img = document.createElement('img');
    img.src = h.img;
    img.alt = h.name;
    img.onerror = function(){ this.style.display='none'; };
    btn.appendChild(img);
    
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = h.name;
    btn.appendChild(lbl);
    
    grid.appendChild(btn);
  });
}

function selectHorse(id) {
  state.selectedHorse = id;
  document.querySelectorAll('.horse-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.id) === id);
  });
  // 显示选中预览
  const horse = HORSES[id];
  const preview = document.getElementById('horsePreview');
  if(horse) {
    preview.innerHTML = `<img src="${horse.img}" alt="${horse.name}"><span class="pname">${horse.name} · ${horse.skill}</span>`;
  }
  updateUI();
}

function updateHorseSelection() {
  const s = SCENES[state.currentScene];
  if(!s) return;
  // 高亮推荐马匹
  document.querySelectorAll('.horse-btn').forEach(b => {
    const horse = HORSES[parseInt(b.dataset.id)];
    b.classList.toggle('recommended', horse.name === s.requires);
  });
}

// ---- 卡牌 ----
function updateCard() {
  const s = SCENES[state.currentScene];
  const card = document.getElementById('card');
  
  if(state.currentRelic === -1) {
    // 全部收集完毕
    card.classList.remove('flipped');
    document.getElementById('cardIcon').textContent = '✅';
    document.getElementById('cardName').textContent = '全部收集';
    document.getElementById('cardDetail').textContent = '此處文物已全部收錄';
    return;
  }
  
  const relic = s.relics[state.currentRelic];
  if(state.collected.has(relic.id)) {
    card.classList.add('flipped');
    document.getElementById('cardIcon').textContent = relic.icon;
    document.getElementById('cardName').textContent = relic.name;
    document.getElementById('cardDetail').textContent = relic.detail;
  } else {
    card.classList.remove('flipped');
  }
}

// ---- 探索 ----
function beginExplore() {
  if(state.selectedHorse === null) {
    showToast('請先選擇一匹神駿');
    return;
  }
  if(state.currentRelic === -1) {
    showToast('此處文物已全部收集');
    return;
  }
  
  const btn = document.getElementById('btnExplore');
  btn.disabled = true;
  btn.textContent = '探索中...';
  
  const s = SCENES[state.currentScene];
  const relic = s.relics[state.currentRelic];
  const horse = HORSES[state.selectedHorse];
  
  // 判定
  setTimeout(() => {
    const isMatch = horse.name === s.requires;
    
    if(isMatch) {
      // 成功！
      state.collected.add(relic.id);
      showDiscover(relic);
      
      // 翻牌动画
      document.getElementById('cardIcon').textContent = relic.icon;
      document.getElementById('cardName').textContent = relic.name;
      document.getElementById('cardDetail').textContent = relic.detail;
      document.getElementById('card').classList.add('flipped');
      
      // 粒子特效
      burstParticles();
      
      // 收集计数
      updateUI();
      buildCollectionGrid();
      
      // 检查是否全部收完此场景
      const allDone = s.relics.every(r => state.collected.has(r.id));
      if(allDone) {
        setTimeout(() => {
          showToast('🏛 此處文物全部收錄！');
          if(state.currentScene < SCENES.length - 1) {
            setTimeout(() => loadScene(state.currentScene + 1), 1000);
          } else {
            setTimeout(() => showToast('🎉 恭喜！全部文物收集完畢！'), 1200);
          }
        }, 600);
      } else {
        // 自动跳到下一件未收集的文物
        setTimeout(() => {
          const next = s.relics.findIndex(r => !state.collected.has(r.id));
          if(next !== -1) {
            state.currentRelic = next;
            updateCard();
          }
        }, 400);
      }
    } else {
      // 失败
      document.getElementById('card').classList.remove('flipped');
      showToast(`❌ ${horse.name} 無法完成此任務...試試其他馬`);
      
      // 扣血效果（摇晃）
      const card = document.getElementById('card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'shake 0.3s';
    }
    
    btn.disabled = false;
    btn.textContent = '派出神駿';
  }, 800);
}

function showDiscover(relic) {
  const el = document.createElement('div');
  el.className = 'discover-text';
  el.textContent = `🔍 發現 ${relic.name}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function burstParticles() {
  const area = document.getElementById('cardArea');
  for(let i=0; i<12; i++) {
    const p = document.createElement('div');
    p.className = 'particle-burst';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    p.style.background = ['#ffd700','#ff8800','#ffcc00','#ffffff'][i%4];
    p.style.left = '50%';
    p.style.top = '50%';
    p.style.animation = `particle 0.6s ease-out forwards`;
    p.style.animationDelay = Math.random()*0.1 + 's';
    area.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

// ---- 图鉴 ----
function buildCollectionGrid() {
  const grid = document.getElementById('collectionGrid');
  grid.innerHTML = '';
  
  SCENES.forEach((s, si) => {
    if(si === 0) {
      // 标题分隔
      // 用场景名称做分组
    }
    s.relics.forEach(r => {
      const item = document.createElement('div');
      item.className = 'collection-item' + (state.collected.has(r.id) ? ' found' : '');
      if(state.collected.has(r.id)) {
        item.innerHTML = `<div class="icon">${r.icon}</div><div class="name">${r.name}</div>`;
        // 检查是否刚获得
        if(state.discovered.has(r.id)) {
          const badge = document.createElement('div');
          badge.className = 'new-badge';
          badge.textContent = 'NEW';
          item.appendChild(badge);
        }
      } else {
        item.innerHTML = '<div class="icon">❓</div><div class="name">???</div>';
        item.style.opacity = '0.5';
      }
      grid.appendChild(item);
    });
  });
}

// ---- UI ----
function updateUI() {
  const collected = state.collected.size;
  document.getElementById('collectCount').textContent = collected;
  document.getElementById('collectedTotal').textContent = collected;
}

function toggleCollection() {
  const panel = document.getElementById('collectionPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) {
    buildCollectionGrid();
  }
}

function showHint() {
  const s = SCENES[state.currentScene];
  const horse = HORSES.find(h => h.name === s.requires);
  if(horse) {
    showToast(`💡 提示：試試派「${horse.name}」去探索`);
  }
}

function showToast(msg) {
  // 移除旧toast
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ---- CSS补充动画 ----
const style = document.createElement('style');
style.textContent = `
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.horse-btn.recommended{border-color:#ff8800;box-shadow:0 0 8px #ff880040}
.collection-item.found .icon{animation:float 3s ease-in-out infinite}
`;
document.head.appendChild(style);

// ---- 启动 ----
init();
console.log('🏛 穆王八骏 · 文物巡游记 loaded');
console.log('💡 选马 → 探索 → 收集文物 → 解锁下一场景');
</script>
</body>
